<svg viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Premium Rigid Box Icon - showing unboxing/opening -->
  <g id="box-icon">
    <!-- Box base (isometric view) -->
    <!-- Top face -->
    <path d="M 60 70 L 100 50 L 140 70 L 100 90 Z" fill="none" stroke="#F5F0E8" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- Left face -->
    <path d="M 60 70 L 60 120 L 100 140 L 100 90 Z" fill="none" stroke="#F5F0E8" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- Right face -->
    <path d="M 140 70 L 140 120 L 100 140 L 100 90 Z" fill="none" stroke="#F5F0E8" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- Lid opening - angle showing the unboxing moment -->
    <path d="M 60 70 Q 70 40 90 35 L 130 45 Q 120 75 100 90" fill="none" stroke="#F5F0E8" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- Foil detail on lid (shimmer effect) -->
    <circle cx="75" cy="52" r="3" fill="#D4A574" opacity="0.8"/>
    <circle cx="110" cy="55" r="3" fill="#D4A574" opacity="0.8"/>

    <!-- Inner glow to suggest premium quality -->
    <ellipse cx="100" cy="95" rx="35" ry="28" fill="none" stroke="#F5F0E8" stroke-width="1" opacity="0.3"/>
  </g>

  <!-- Text: PICASSO (light/ivory) -->
  <text x="160" y="90" font-family="Arial, sans-serif" font-size="52" font-weight="700" letter-spacing="3" fill="#F5F0E8">PICASSO</text>

  <!-- Text: PRINT & PACK (gold accent) -->
  <text x="160" y="125" font-family="Arial, sans-serif" font-size="16" font-weight="400" letter-spacing="2" fill="#D4A574">PRINT &amp; PACK</text>

  <!-- Accent line -->
  <line x1="160" y1="132" x2="240" y2="132" stroke="#D4A574" stroke-width="1.5"/>
</svg>